<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OSDI" />
  <title>OSDI Calculator</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root { color-scheme: light; --bg:#f5f5f7; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#111827; }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:0 auto;padding:0 16px calc(36px + env(safe-area-inset-bottom))}
    .sticky-head{position:sticky;top:0;z-index:100;background:rgba(245,245,247,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid rgba(229,231,235,.9);margin-bottom:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px}.titlebox{min-width:0;flex:1}
    h1{font-size:29px;margin:0 0 5px}.sub{color:var(--muted);font-size:14.5px;margin:0;line-height:1.4}
    .logos{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex:0 0 auto}.logos img{display:block;object-fit:contain;border:0!important;outline:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;background:transparent!important}.logos .eom{width:72px;height:58px}.logos .yes{width:98px;height:58px}
    .progress{background:#e5e7eb;height:7px;border-radius:999px;overflow:hidden;margin:8px 0 0}.bar{height:100%;background:#111827;width:0%;transition:.2s}
    .card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .qnum{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:7px}.q{font-size:18px;line-height:1.45;font-weight:650;margin-bottom:14px}
    .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.opts button{appearance:none;border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:7px 2px 9px;color:var(--text);min-width:0;line-height:1.15}
    .opts button .word{display:block;font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap;margin-bottom:5px;letter-spacing:-.03em}.opts button .num{display:block;font-size:19px;font-weight:800}
    .opts button.active{background:#111827;color:#fff;border-color:#111827}.opts button.active .word{color:#fff}
    .na-row{margin-top:7px}.na-btn{width:100%;appearance:none;border:1px solid var(--line);background:#f3f4f6;border-radius:12px;padding:9px 10px;color:var(--text);font-size:13px;font-weight:700}.na-btn.active{background:#111827;color:#fff;border-color:#111827}
    .result{position:sticky;bottom:10px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .score{font-size:32px;font-weight:800}.severity{font-weight:700}.meta{font-size:13px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:700}.primary{background:#111827;color:white}.secondary{background:#eee;color:#111827}
    .note{font-size:12px;color:var(--muted);line-height:1.45;margin:18px 2px 0}
    @media (max-width:430px){.wrap{padding-left:10px;padding-right:10px}.sticky-head{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:7px}.top{gap:8px}.titlebox{max-width:55%}h1{font-size:23px;margin-bottom:3px}.sub{font-size:12.5px;line-height:1.3}.logos{gap:5px}.logos .eom{width:61px;height:49px}.logos .yes{width:83px;height:49px}.card{padding:15px 12px}.qnum{font-size:13px}.q{font-size:17px}.opts{gap:4px}.opts button{padding:8px 1px 10px}.opts button .word{font-size:11px}.opts button .num{font-size:18px}.result{bottom:6px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="sticky-head">
    <div class="top"><div class="titlebox"><h1>OSDI Calculator</h1><div class="sub">Ocular Surface Disease Index · 지난 1주일 동안의 증상을 기준으로 선택하세요.</div></div><div class="logos" aria-label="logos"><img class="eom" src="logo_eom.png" alt="EOM logo"><a href="https://yes-oph.com/" target="_blank" rel="noopener noreferrer" aria-label="YES Eye Clinic 홈페이지"><img class="yes" src="logo_yes.jpg" alt="YES Eye Clinic logo"></a></div></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
  <div id="questions"></div>
  <div class="result">
    <div><span class="score" id="score">—</span> <span>/ 100</span></div>
    <div class="severity" id="severity">응답을 선택하세요</div>
    <div class="meta" id="meta">0 / 12 문항 응답</div>
    <div class="actions">
      <button class="secondary" onclick="resetAll()">초기화</button>
      <button class="primary" onclick="copyResult()">결과 복사</button>
    </div>
  </div>
  <div class="note">OSDI 점수 = (응답한 문항 점수의 합 × 25) ÷ 점수 계산에 포함된 문항 수. 문항 6–9의 해당 없음(N/A)과 미응답 문항은 계산에서 제외됩니다. 본 도구는 점수 계산 보조용이며 임상적 판단을 대체하지 않습니다.</div>
</div>
<script>
const qs = [
"빛에 민감했습니까?",
"눈이 모래가 들어간 것처럼 까끌거리거나 이물감이 있었습니까?",
"눈이 아프거나 쓰라렸습니까?",
"시야가 흐렸습니까?",
"시력이 좋지 않다고 느꼈습니까?",
"독서할 때 눈의 불편함 때문에 어려움이 있었습니까?",
"야간 운전할 때 눈의 불편함 때문에 어려움이 있었습니까?",
"컴퓨터 작업 또는 은행단말기(ATM) 등을 사용할 때 눈의 불편함 때문에 어려움이 있었습니까?",
"TV를 볼 때 눈의 불편함 때문에 어려움이 있었습니까?",
"바람이 부는 환경에서 눈이 불편했습니까?",
"습도가 낮고 매우 건조한 장소에서 눈이 불편했습니까?",
"에어컨이 있는 장소에서 눈이 불편했습니까?"
];
const choices = [{v:4,label:"항상"},{v:3,label:"대부분"},{v:2,label:"절반"},{v:1,label:"가끔"},{v:0,label:"전혀"}];
const answers = Array(12).fill(null);
const qwrap = document.getElementById('questions');
qs.forEach((q,i)=>{
  const c=document.createElement('div'); c.className='card';
  const na = (i >= 5 && i <= 8) ? `<div class="na-row"><button class="na-btn" data-q="${i}" data-na="1" aria-label="해당 없음">해당 없음 (N/A)</button></div>` : '';
  c.innerHTML=`<div class="qnum">문항 ${i+1}</div><div class="q">${q}</div><div class="opts">${choices.map(x=>`<button data-q="${i}" data-v="${x.v}" aria-label="${x.label} ${x.v}점"><span class="word">${x.label}</span><span class="num">${x.v}</span></button>`).join('')}</div>${na}`;
  qwrap.appendChild(c);
});
document.querySelectorAll('.opts button').forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.q,v=+b.dataset.v; answers[i]=v;
  document.querySelectorAll(`button[data-q="${i}"]`).forEach(x=>x.classList.toggle('active',x===b));
  update();
}));
document.querySelectorAll('.na-btn').forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.q; answers[i]='na';
  document.querySelectorAll(`button[data-q="${i}"]`).forEach(x=>x.classList.toggle('active',x===b));
  update();
}));
function update(){
  const completed=answers.filter(v=>v!==null).length;
  const valid=answers.filter(v=>typeof v==='number'); const n=valid.length; const sum=valid.reduce((a,b)=>a+b,0);
  const naCount=answers.filter(v=>v==='na').length;
  document.getElementById('bar').style.width=`${completed/12*100}%`;
  document.getElementById('meta').textContent=naCount ? `${completed} / 12 문항 응답 · 점수 계산 ${n}문항 (N/A ${naCount})` : `${completed} / 12 문항 응답`;
  if(!n){document.getElementById('score').textContent='—';document.getElementById('severity').textContent=completed ? '점수 계산 가능한 응답이 없습니다' : '응답을 선택하세요';return;}
  const s=sum*25/n; const rounded=Math.round(s*10)/10;
  document.getElementById('score').textContent=rounded.toFixed(1);
  let sev='정상'; if(s>=33) sev='중증'; else if(s>=23) sev='중등도'; else if(s>=13) sev='경도';
  document.getElementById('severity').textContent=sev;
}
function resetAll(){answers.fill(null);document.querySelectorAll('.opts button').forEach(b=>b.classList.remove('active'));update();window.scrollTo({top:0,behavior:'smooth'});}
async function copyResult(){
  const valid=answers.filter(v=>typeof v==='number'); if(!valid.length) return;
  const naCount=answers.filter(v=>v==='na').length;
  const sum=valid.reduce((a,b)=>a+b,0), s=Math.round((sum*25/valid.length)*10)/10;
  let sev='정상'; if(s>=33) sev='중증'; else if(s>=23) sev='중등도'; else if(s>=13) sev='경도';
  const text=`OSDI ${s.toFixed(1)} / 100 (${sev}), 점수 계산 ${valid.length}문항${naCount ? `, N/A ${naCount}문항` : ''}`;
  try{await navigator.clipboard.writeText(text); alert('결과를 복사했습니다.');}catch(e){prompt('결과를 복사하세요:',text);}
}
if ('serviceWorker' in navigator) {
  let reloadingForUpdate = false;

  // If an updated service worker takes control while the app is open,
  // reload once so the newest GitHub version appears immediately.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloadingForUpdate) return;
    reloadingForUpdate = true;
    window.location.reload();
  });

  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      // Explicitly check GitHub for a newer worker whenever the app opens online.
      await reg.update();
    } catch (e) {
      // Offline is expected and supported after the first successful install/cache.
    }
  });
}
update();
</script>
</body>
</html>
